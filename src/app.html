<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Insyn</title>
<style>
:root{
  --brand:#3563c9;--brand2:#4a78d8;--brand-ink-l:#2a4fa3;--brand-soft-l:#e9effb;--brand-ink:var(--brand-ink-l);--brand-soft:var(--brand-soft-l);
  --bg:#eef1f6;--panel:#fff;--panel2:#f7f9fc;--ink:#1d2330;--ink2:#555f72;--ink3:#8a93a5;--line:#e3e7ee;--line2:#f0f2f6;
  --pos:#14995a;--pos-soft:#e5f5ec;--neg:#e0473e;--neg-soft:#fdecea;
  --hdr:var(--brand);--hdr2:var(--brand2);--hdr-ink:#fff;
  --sh:0 1px 3px rgba(20,30,50,.07);--sh2:0 14px 40px rgba(10,20,40,.22);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  font-family:"Segoe UI",Roboto,system-ui,-apple-system,Arial,sans-serif;font-size:14px;color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
html.dark{
  --brand-ink:#8fb0ff;
  --bg:#0e131d;--panel:#161d2a;--panel2:#1b2332;--ink:#e7ecf5;--ink2:#a7b1c4;--ink3:#76819a;--line:#273248;--line2:#1f2839;
  --brand-soft:#1f2c47;--pos:#3ccf86;--pos-soft:#15342a;--neg:#ff6b62;--neg-soft:#3a1f22;
  --hdr:#16213a;--hdr2:#1c2a49;--sh:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden;margin:0}
body{background:var(--bg);overscroll-behavior-x:none}
#root{width:100%;max-width:100vw;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
svg{display:block;max-width:100%}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
/* ---------- header (två rader som BrightAnalytics) */
.hdr{background:var(--hdr);color:var(--hdr-ink);position:sticky;top:0;z-index:40;padding-top:var(--safe-t)}
.hdr1{display:flex;align-items:center;gap:6px;height:54px;padding:0 16px}
.brandmark{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:18px;white-space:nowrap;cursor:pointer}
.brandmark small{display:block;font-size:10.5px;font-weight:400;opacity:.8;letter-spacing:0;margin-top:-3px}
.brandmark svg{flex:none}
.gtabs{display:flex;align-self:stretch;gap:2px;min-width:0;overflow:hidden}
.gtab{display:flex;align-items:center;gap:6px;padding:0 18px;color:#fff;opacity:.92;text-decoration:none;font-weight:500;font-size:15px;border-radius:10px 10px 0 0;margin-top:8px;white-space:nowrap;cursor:pointer}
.gtab:hover{opacity:1;background:rgba(255,255,255,.08)}
.gtab.on{background:var(--hdr2);opacity:1}
.hdr1 .sp{flex:1}
.hbtn{border:none;background:transparent;color:#fff;padding:8px;border-radius:9px;cursor:pointer;display:grid;place-items:center;flex:none}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hav{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--brand-ink);display:grid;place-items:center;font-size:11.5px;font-weight:700;cursor:pointer;flex:none;margin-left:4px}
html.dark .hav{background:#2a3a5e;color:#cfe0ff}
.hdr2{background:var(--hdr2);display:flex;align-items:center;gap:10px;padding:8px 16px 9px}
.ws{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap;border:none;flex:none}
html.dark .ws{background:#24324f;color:#e7ecf5}
.stabs{display:flex;gap:4px;min-width:0;flex-wrap:wrap;flex:1}
.stab{color:#fff;text-decoration:none;padding:6px 12px;border-radius:8px;font-weight:500;white-space:nowrap;opacity:.95;cursor:pointer;border:none;background:transparent}
.stab:hover{background:rgba(255,255,255,.12)}
.stab.on{background:#fff;color:var(--brand-ink)}
html.dark .stab.on{background:#2c3d62;color:#fff}
.stab.add{opacity:.75}
.hdr2 .right{display:flex;align-items:center;gap:4px;flex:none}
.hdr2 .lnk{color:#fff;background:transparent;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px;font-weight:500;white-space:nowrap}
.hdr2 .lnk:hover{background:rgba(255,255,255,.12)}
/* ---------- body */
.body{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;padding:14px 14px 40px;max-width:1920px;margin:0 auto;width:100%}
.body.nofp{grid-template-columns:52px minmax(0,1fr)}
.fp{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:10px;align-self:start;position:sticky;top:118px;max-height:calc(100vh - 132px);overflow:auto}
.fp .fph{display:flex;align-items:center;gap:10px;padding:2px 2px 10px;color:var(--ink2);font-size:16px}
.fp .collapse{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);border:none;display:grid;place-items:center;cursor:pointer;flex:none}
.fsec{border-top:1px solid var(--line2)}
.fsec>button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:none;padding:12px 6px;cursor:pointer;color:var(--ink);font-size:14.5px;text-align:left}
.fsec>button small{color:var(--brand);font-weight:500;font-size:12px;margin-left:auto;margin-right:6px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsec>button svg{transition:transform .15s;color:var(--ink3);flex:none}
.fsec.open>button svg{transform:rotate(90deg)}
.fsec .fl{display:none;padding:0 2px 10px}
.fsec.open .fl{display:block}
.fl label{display:flex;gap:9px;align-items:center;padding:6px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.fl label:hover{background:var(--line2)}
.fl .gl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 6px 2px;font-weight:700}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:16px;height:16px;flex:none}
.content{min-width:0}
/* ---------- toolbar (segment-grupper) */
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:stretch}
.seg{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh);min-height:44px}
.seg .si{background:var(--brand);color:#fff;display:grid;place-items:center;width:42px;flex:none}
.seg .sv{position:relative;display:flex;flex-direction:column;justify-content:center;padding:4px 30px 4px 12px;cursor:pointer;min-width:0;background:var(--brand-soft)}
.seg .sv+.sv{border-left:1px solid var(--line);background:var(--panel)}
.seg .sv:after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:translateY(-70%) rotate(45deg)}
.seg .sv b{font-weight:500;font-size:14.5px;white-space:nowrap;color:var(--ink)}
.seg .sv small{font-size:10.5px;color:var(--ink3);line-height:1.1;white-space:nowrap}
.seg .sv select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.seg .sbtn{background:var(--brand);color:#fff;display:flex;align-items:center;gap:7px;padding:0 14px;font-weight:500;white-space:nowrap}
.fsumm{display:none}
/* ---------- grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.w{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:16px 18px;min-width:0;position:relative;container-type:inline-size}
.w.full{grid-column:span 12}.w.half{grid-column:span 6}.w.third{grid-column:span 4}.w.quarter{grid-column:span 3}.w.twothird{grid-column:span 8}
.wh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px -6px 10px 0;min-height:30px}
.wh h3{margin:0;font-size:17px;font-weight:400;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wh .tools{display:flex;gap:0;flex:none}
.ibtn{border:none;background:transparent;padding:6px;border-radius:7px;cursor:pointer;color:var(--ink3);display:inline-grid;place-items:center}
.ibtn:hover{background:var(--line2);color:var(--ink)}
.ibtn.on{color:var(--brand);background:var(--brand-soft)}
.w.editing{outline:2px dashed var(--brand2);outline-offset:2px}
/* KPI-rad */
.kstrip{padding:0;display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr))}
.kc{padding:16px 14px 16px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.kc:first-child{border-left:none}
.kc .kt{display:flex;align-items:center;gap:9px;font-weight:500;color:var(--brand);font-size:14.5px;min-width:0;max-width:100%}
.kc .kt span:last-child{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25;text-align:left}
html.dark .kc .kic{background:rgba(255,255,255,.08)!important}
.kc .kic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.kc .kv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:center}
.kc .kv b{font-size:21px;font-weight:400;letter-spacing:.06em;white-space:nowrap}
.kc .kd{font-size:13px;letter-spacing:.04em;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.kc .kcmp{font-size:11.5px;color:var(--ink3)}
.kstrip .wtools{position:absolute;top:4px;right:4px}
/* enskild KPI */
.kpi .lbl{font-size:14px;color:var(--brand);font-weight:500;display:flex;align-items:center;gap:9px}
.kpi .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px}
.kpi .v{font-size:26px;font-weight:400;letter-spacing:.03em;line-height:1.1;white-space:nowrap;flex:none}
.kpi .spark{flex:1 1 auto;min-width:40px;max-width:140px;width:auto;height:38px}
.kpi .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:500;font-size:12.5px;white-space:nowrap}
.delta.up{color:var(--pos)}.delta.down{color:var(--neg)}.delta.flat{color:var(--ink3)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--ink3)}
/* tabeller */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.t th{font-size:11.5px;color:var(--ink3);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom;line-height:1.3;background:var(--panel);text-transform:uppercase;letter-spacing:.04em}
.t th:first-child,.t td:first-child{text-align:left;padding-left:6px;position:sticky;left:0;background:var(--panel);z-index:1}
.t td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
.t tr:last-child td{border-bottom:none}
.t tr.hdr td{font-weight:700;padding-top:16px;padding-bottom:6px;color:var(--brand);border-bottom:none;font-size:12px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none}
.t tr.hdr td .chev{display:inline-block;transition:transform .15s;margin-right:4px}
.t tr.hdr.closed td .chev{transform:rotate(-90deg)}
.t tr.sub td{font-weight:500;background:var(--panel2)}
.t tr.total td{font-weight:700;background:var(--panel2);border-top:1px solid var(--line)}
.t tr.grand td{font-weight:700;background:var(--brand-soft);color:var(--brand-ink)}
.t tr.mutedrow td{color:var(--ink3);font-size:12.5px}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--brand-soft)}
.t td.l1{padding-left:20px}
.t .dv.up{color:var(--pos);font-weight:500}.t .dv.down{color:var(--neg);font-weight:500}
.t .mcol{color:var(--ink2)}
/* mobil listvy */
.ml{display:none}
.ml .mh2{font-size:11.5px;color:var(--brand);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:14px 0 6px}
.ml .mr{border-bottom:1px solid var(--line2);padding:11px 0}
.ml .mr:last-child{border-bottom:none}
.ml .mtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;cursor:pointer;min-width:0}
.ml .mtop .ml-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml .mtop .ml-v{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.ml .msub{display:flex;justify-content:space-between;gap:10px;margin-top:3px;font-size:12.5px;color:var(--ink3)}
.ml .mr.sub .ml-l,.ml .mr.total .ml-l{font-weight:500}
.ml .mr.grand{background:var(--brand-soft);border-radius:10px;padding:11px 12px;border:none;margin:4px 0}
.ml .mr.grand .ml-l,.ml .mr.grand .ml-v{font-weight:700;color:var(--brand-ink)}
.ml .mdet{display:none;margin-top:10px;background:var(--line2);border-radius:10px;padding:10px 12px}
.ml .mr.open .mdet{display:block}
.ml .mdet div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
.ml .mdet div span:first-child{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml .mdet div span:last-child{font-variant-numeric:tabular-nums;font-weight:500;flex:none}
/* diagram */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto}
.gl{stroke:var(--line)}.gl0{stroke:var(--ink3);stroke-opacity:.45}
.axt{fill:var(--ink3);font-size:11.5px}.axb{fill:var(--ink);font-size:11.5px;font-weight:700}
.vlab{fill:var(--brand-ink);font-size:11px;font-weight:500}
.dlab{fill:var(--ink);font-size:12px;font-weight:700}.dlab2{fill:var(--ink3);font-size:11px}
.dotbg{fill:var(--panel)}
.curp{fill:var(--brand);opacity:.06}
.ctr1{fill:var(--ink);font-size:17px;font-weight:700}.ctr2{fill:var(--ink3);font-size:10.5px}
.lead{stroke:var(--ink3);stroke-opacity:.5;fill:none}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.legend i.dash{height:3px;width:16px;border-radius:2px}
.dleg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 20px;margin-top:6px}
.dleg div{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.dleg i{width:12px;height:12px;border-radius:3px;flex:none}
.dleg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.dleg b{font-weight:500;font-variant-numeric:tabular-nums}
#tip{position:fixed;pointer-events:none;background:#1d2330;color:#fff;border-radius:9px;padding:9px 11px;font-size:12.5px;z-index:90;box-shadow:var(--sh2);min-width:150px;opacity:0;transition:opacity .1s;max-width:min(260px,80vw);left:0;top:0}
#tip.on{opacity:1}
#tip b{display:block;margin-bottom:5px;font-size:12px;color:#c9d3e6;font-weight:500}
#tip div{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* insikter */
.ins .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer;min-width:0}
.ins .it:last-child{border-bottom:none}
.ins .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.ins .ic.up{background:var(--pos-soft);color:var(--pos)}.ins .ic.down{background:var(--neg-soft);color:var(--neg)}
.ins .tx{flex:1;min-width:0}
.ins .tx b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins .tx span{font-size:12.5px;color:var(--ink3)}
.ins .am{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
/* knappar/formulär */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
a.btn{text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:4px 0 14px;flex-wrap:wrap}
.head h1{margin:0;font-size:22px;font-weight:500}
.head .sub{color:var(--ink2);margin-top:4px;font-size:13.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:18px 20px;margin-bottom:14px;min-width:0}
.panel h2{margin:0 0 14px;font-size:16px;font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>label{font-size:12.5px;color:var(--ink2);font-weight:500}
select,input[type=text],input[type=password],input[type=number],input:not([type]),textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);min-width:0;max-width:100%;font-size:14px}
select:focus,input:focus,textarea:focus{outline:3px solid var(--brand-soft);border-color:var(--brand)}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--panel)}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--panel);font-size:12.5px;cursor:pointer;user-select:none;color:var(--ink2);max-width:100%}
.chip.on{background:var(--brand-soft);border-color:var(--brand2);color:var(--brand-ink)}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.tag.b{background:var(--brand-soft);color:var(--brand-ink)}.tag.g{background:var(--pos-soft);color:var(--pos)}.tag.r{background:var(--neg-soft);color:var(--neg)}
.err{background:var(--neg-soft);color:var(--neg);border-radius:10px;padding:11px 14px;margin:12px 0;line-height:1.55;overflow-wrap:anywhere}
.ok{background:var(--pos-soft);color:var(--pos);border-radius:10px;padding:11px 14px;margin:12px 0}
.note{background:#fff5e0;color:#7a5200;border-radius:10px;padding:11px 14px;margin:0 0 14px;font-size:13px;line-height:1.5}
html.dark .note{background:#3a2e14;color:#f3d9a0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-width:0}
.card:hover{border-color:var(--brand2)}
.card .ci{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.card b{display:block;margin-bottom:3px;font-weight:500}
/* modal, meny, sheet */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:60;overflow:auto}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--sh2);width:min(980px,100%);padding:20px 22px;min-width:0}
.modal.wide{width:min(1400px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.modal .mh h2{margin:0;font-size:18px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crumbs{font-size:12.5px;color:var(--ink3);margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{cursor:pointer;color:var(--brand)}
.menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);padding:6px;min-width:220px;max-width:calc(100vw - 16px)}

function fmtNum(v, f, unit){

  if (f === "pp") return (v>0?"+":"") + nf1.format(v*100) + " %-enh";

  const txt = salt + ":" + pw;

    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));

}

function evalFormula(expr, vals){
  // egen tolk för + - * / och parenteser – ingen eval
  const toks = String(expr).match(/[A-Za-z_][A-Za-z0-9_]*|\d+(?:[.,]\d+)?|[-+*/()]/g) || [];
  let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  function atom(){
    const t = next();
    if (t===undefined) throw 0;
    if (t==="("){ const v = sum(); if (next()!==")") throw 0; return v; }
    if (t==="-") return -atom();
    if (t==="+") return atom();
    if (/^\d/.test(t)) return parseFloat(t.replace(",","."));
    const v = vals[t]; if (v==null || !isFinite(v)) throw 1; return v;
  }
  function prod(){ let v = atom(); while (peek()==="*"||peek()==="/"){ const op = next(), b = atom(); v = op==="*" ? v*b : v/b; } return v; }
  function sum(){ let v = prod(); while (peek()==="+"||peek()==="-"){ const op = next(), b = prod(); v = op==="+" ? v+b : v-b; } return v; }
  try{ const r = sum(); if (i!==toks.length) return null; return isFinite(r) ? r : null; }catch(e){ return null; }
}

let loginTries = {};
async function doLogin(e){
  e.preventDefault();
  const un = $("#lu").value.trim().toLowerCase(), pw = $("#lp").value;
  const t = loginTries[un]||{n:0,until:0};
  if (Date.now() < t.until){ $("#lerr").textContent = "Kontot är tillfälligt spärrat efter flera felaktiga försök. Försök igen om en minut."; return; }
  const u = S.users.find(x=>x.username.toLowerCase()===un);
  if (u && u.active && await hashPw(pw,u.salt)===u.pw){
    U=u; loginTries[un]={n:0,until:0}; touch(); applyTheme(); log("Inloggning"); location.hash = "#start"; render();
  } else {
    t.n++; if (t.n>=5){ t.until=Date.now()+60000; t.n=0; } loginTries[un]=t;
    if (u) { const uu=U; U=u; log("Misslyckad inloggning"); U=uu; }

  }
}

function codesIn(i, all){ // koder som finns i datan och användaren får se (utan hänsyn till valt filter)
  const perm = all ? null : permittedCC(); const used = new Set();
  YEARS.forEach(y=>(AGG[y]||[]).forEach(r=>{ const c=r[DI+i]; if (c && permRow(r,perm)) used.add(c); }));
  return [...used].sort();
}
function selLabel(i){ return ((F.dim||{})[i]||[]).map(c=>String(c).startsWith("g:")?(S.groups.find(g=>g.id===c.slice(2))||{}).name:c).join(", "); }
function ccLabel(){ const parts=[]; for (let i=0;i<ND;i++){ const l = selLabel(i); if (l) parts.push(`${dimName(i)}: ${l}`); } return parts.length ? parts.join(" · ") : (permittedCC()?`Mina (${dimName(PD())})`:"Alla"); }
function filterSections(){
  const perm = permittedCC();
  const sec = (k, title, sum, inner) => `<div class="fsec ${OPENSEC.has(k)?"open":""}"><button data-fsec="${k}"><span>${esc(title)}</span><small>${esc(sum)}</small>${ic("chev",16)}</button><div class="fl" style="max-height:320px;overflow:auto">${inner}</div></div>`;
  let h = "";
  for (const i of [8,0,1,2,3,4,5,6,7]){
    if (!dimActive(i)) continue;
    const codes = codesIn(i); if (!codes.length || (i===8 && codes.length<2 && !(F.dim||{})[8])) continue;
    const sel = (F.dim||{})[i]||[];
    const grps = S.groups.filter(g=>g.dim===i && g.codes.some(c=>codes.includes(c)));
    h += sec("d"+i, dimName(i), selLabel(i),
      `<label><input type="checkbox" data-dim="${i}" data-code="" ${!sel.length?"checked":""}> ${i===PD()&&perm?"Mina":"Alla"}</label>`
      + (grps.length?`<div class="gl">Sammanslagningar</div>`+grps.map(g=>`<label><input type="checkbox" data-dim="${i}" data-code="g:${g.id}" ${sel.includes("g:"+g.id)?"checked":""}> ${esc(g.name)}</label>`).join("")+`<div class="gl">Koder</div>`:"")
      + codes.map(c=>`<label><input type="checkbox" data-dim="${i}" data-code="${esc(c)}" ${sel.includes(c)?"checked":""}> ${esc(codeLabel(i,c))}</label>`).join(""));
  }
  return h + sec("unit","Enhet", F.unit==="teur"?"tEUR":"EUR", [["eur","EUR"],["teur","Tusen EUR"]].map(([k,l])=>`<label><input type="radio" name="un" data-unit="${k}" ${F.unit===k?"checked":""}> ${l}</label>`).join(""));
}

  }catch(err){ console.error(err); inner = `<div class="err">Kunde inte visa: ${esc(err.message)}</div>`; }

/* ---- diagram */
const SRC = {utf:"Utfall",bud:"Budget",prg:"Prognos",fg:"Föregående år"};
function monthSeries(w, src, ccSet){
  const ln = S.structures[w.structure].lines.find(l=>l.id===w.line); if(!ln) return Array(12).fill(null);
  const out = []; const y=+F.year; const saveP = F.period;
  for (let p=1;p<=12;p++){
    let v = null;
    if (src==="utf"){ if (p<=(LASTP[y]||12)){ F.period=p; v = lineMeasure(w.structure,w.line,"utf_p",ccSet); } }
    else if (src==="fg"){ if (ACT[y-1]){ F.period=p; v = lineMeasure(w.structure,w.line,"fg_p",ccSet); } }
    else if (src==="bud"){ if (F.bud){ F.period=p; v = lineMeasure(w.structure,w.line,"bud_p",ccSet); } }
    else if (src==="prg"){ if (F.prg && version(F.prg)) v = monthVer(w, F.prg, p, ccSet); }
    out.push(v);
  }
  F.period = saveP;
  if (w.cumulative && ln.format!=="pct"){ let s=0; return out.map(v=>{ if(v==null) return null; s+=v; return s; }); }
  return out;
}
function monthVer(w, vid, p, ccSet){
  const st = S.structures[w.structure]; const vals={};
  for (const ln of st.lines){
    if (ln.type==="accounts"){ const s = sumVer(vid, parseRanges(ln.accounts), p, p, ccSet); vals[ln.id] = s==null?null:s*ln.sign; }
    else if (ln.type==="formula") vals[ln.id] = evalFormula(ln.formula, vals);

}
function wrap(txt, max){
  const out=[""]; txt.split(" ").forEach(w=>{ const cur=out[out.length-1]; if (!cur) out[out.length-1]=w; else if ((cur+" "+w).length<=max) out[out.length-1]=cur+" "+w; else out.push(w); });
  if (out.length>2){ out[1] = out.slice(1).join(" "); out.length=2; }
  return out.map(l=>l.length>max+2?l.slice(0,max+1)+"…":l);
}
function niceScale(min, max, n=4){
  if (min===max){ max = min+1; }

  const step = [1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=step0) || 10*mag;

function smooth(pts){
  if (pts.length<2) return pts.length?`M${pts[0][0]},${pts[0][1]}`:"";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2; const t=.16;
    d += `C${p1[0]+(p2[0]-p0[0])*t},${p1[1]+(p2[1]-p0[1])*t} ${p2[0]-(p3[0]-p1[0])*t},${p2[1]-(p3[1]-p1[1])*t} ${p2[0]},${p2[1]}`;
  }

function segments(data, x, y){ const segs=[]; let cur=[]; data.forEach((v,i)=>{ if(v==null){ if(cur.length) segs.push(cur); cur=[]; } else cur.push([x(i),y(v)]); }); if(cur.length) segs.push(cur); return segs; }
const tipAttr = html => `data-tip="${esc(html)}"`;
function chartW(w){ const vw = Math.min(innerWidth, document.documentElement.clientWidth||innerWidth); if (vw<=820) return Math.max(280, vw-50); return ({full:1200,twothird:800,half:620,third:420,quarter:320})[w.width]||620; }

const PALETTE = ["#2f64ad","#f07a2b","#a9c4ea","#f6e3a8","#f4a62a","#1f3f73","#56b4e9","#84cc16","#8b5cf6"];

function dimChart(w){

function wfBars(w){

  const small = innerWidth<=820;

}

function showTip(el, ev){
  const t = $("#tip"); t.innerHTML = el.getAttribute("data-tip"); t.classList.add("on");
  const r = t.getBoundingClientRect(); let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  t.style.left = Math.max(8,x)+"px"; t.style.top = Math.max(8,y)+"px";
}
function hideTip(){ const t=$("#tip"); if (t) t.classList.remove("on"); }

function leafLines(st, id, seen=new Set()){
  if (seen.has(id)) return []; seen.add(id);

}

function fixWidget(w){
  const st = S.structures[w.structure]; if (!st) return;
  const ids = st.lines.map(l=>l.id); const firstVal = (st.lines.find(l=>l.type!=="header")||{}).id;
  if (w.line && !ids.includes(w.line)) w.line = firstVal;
  if (w.type==="chart" && !w.line) w.line = st.lines.filter(l=>l.type==="formula").slice(-1)[0]?.id || firstVal;
  if (w.total && !ids.includes(w.total)) w.total = st.lines.filter(l=>l.type==="formula").slice(-1)[0]?.id;
  if (w.items) w.items.forEach(it=>{ if (!ids.includes(it.line)) it.line = firstVal; });
  const kind = st.kind||"flow"; const okM = m => MEASURES[m] && MEASURES[m].k===kind;
  if (w.type==="kpistrip"){ if (kind==="bal" && !["fgar","fgp"].includes(w.compare)) w.compare="fgar"; if (kind!=="bal" && !["bud","fg"].includes(w.compare)) w.compare="bud"; }
  else { if (w.measure && !okM(w.measure)) w.measure = kind==="bal"?"bal_p":"utf_ack"; if (w.compare && !okM(w.compare)) w.compare = ""; }
  if (w.columns) { w.columns = w.columns.filter(okM); if (!w.columns.length) w.columns = kind==="bal"?["bal_p","bal_fg_ar"]:["utf_ack","bud_ack","avv_bud_ack"]; }
  if (w.measures) { w.measures = w.measures.filter(okM); if (!w.measures.length) w.measures=["utf_ack"]; }
  if (w.type==="table" && kind==="bal") w.colMode="measures";
  if (w.type==="chart" && w.mode==="month" && !(w.series&&w.series.length)) w.series=[{src:"utf",kind:"bar",color:"#3563c9"},{src:"bud",kind:"line",color:"#f07a2b"}];
  if (w.mode==="o1") w.mode="dim"; if (w.rowsMode==="o1") w.rowsMode="dim";
  if ((w.mode==="dim"||w.mode==="donut"||w.rowsMode==="dim"||w.rowsMode==="grupper") && w.dim==null) w.dim = PD();
  if (w.type==="chart" && w.mode==="dim" && !w.measures) { w.measures=["utf_ack","bud_ack"]; w.colors=["#3563c9","#a9c4ea"]; }
  if (w.type==="chart" && w.mode==="donut" && !w.measure) w.measure="utf_ack";
  if (w.type==="chart" && w.mode==="waterfall" && !w.lines) w.lines = st.lines.filter(l=>l.type==="accounts").slice(0,4).map(l=>l.id).join(",");
  if (w.type==="chart" && kind==="bal" && w.mode!=="month") { w.mode="month"; w.chartType="bar"; }
}

const verDimsUsed = rows => Array.from({length:ND},(_,i)=>i).filter(i=>rows.some(r=>r[VD+i]));
function templateRows(prefill){

  const head = ["Konto","Kontonamn",...dims.map(dimName),...Array.from({length:12},(_,i)=>String(i+1))];

    [...m.entries()].sort().forEach(([k,arr])=>{ const [a,...d]=k.split("|"); out.push([a,ACC[a]?ACC[a].name:"",...d,...arr.map(x=>Math.round(x))]); });
  } else {

function handleImportFile(file){

let IMPORT = null;
function validateImport(aoa){
  const norm = s => String(s).trim().toLowerCase().replace(/[åä]/g,"a").replace(/ö/g,"o").replace(/\s+/g,"");
  let hi = aoa.findIndex(r=>r.some(c=>["konto","account"].includes(norm(c))));
  if (hi<0) throw new Error("Hittar ingen rubrikrad med kolumnen ”Konto”.");
  const h = aoa[hi].map(norm);
  const cA = h.findIndex(x=>["konto","account"].includes(x));
  // dimensionskolumner: namnet (t.ex. Kst, Klass) eller o1–o8
  const colIdx = Array.from({length:ND},(_,i)=>h.findIndex(x=>x===norm(dimName(i)) || x===dimCol(i) || (i===8 && ["bolag","cid","foretag"].includes(x))));
  if (colIdx[PD()]<0){ const alt = h.findIndex(x=>["kostnadsstalle","ansvar"].includes(x)); if (alt>=0) colIdx[PD()] = alt; }
  const months = Array.from({length:12},(_,i)=>h.findIndex(x=>x===String(i+1)||x==="p"+(i+1)||x===MONTHS[i]||x===MONTHS_LONG[i].replace(/[åä]/g,"a")||x==="period"+(i+1)));
  if (months.some(x=>x<0)) throw new Error("Hittar inte alla tolv månadskolumner (1–12 eller jan–dec). Saknas: " + months.map((x,i)=>x<0?MONTHS[i]:null).filter(Boolean).join(", "));
  const errors=[], warnings=[], rows=[]; const seen=new Set();
  const found = colIdx.map((c,i)=>c>=0?dimName(i):null).filter(Boolean);
  warnings.push(found.length ? `Dimensioner i filen: ${found.join(", ")}.` : "Filen saknar dimensionskolumner – beloppen läggs utan dimension.");
  for (let r=hi+1; r<aoa.length; r++){
    const row = aoa[r]; if (!row || row.every(c=>String(c).trim()==="")) continue;
    const acc = String(row[cA]).trim().replace(/\.0$/,""); const rn = r+1;
    const d = colIdx.map(c=>c>=0?String(row[c]).trim().replace(/\.0$/,""):"");
    if (!acc){ errors.push(`Rad ${rn}: konto saknas.`); continue; }
    if (!ACC[acc]) errors.push(`Rad ${rn}: kontot ${acc} finns inte i kontoplanen.`);
    else if (!isPL(acc)) warnings.push(`Rad ${rn}: ${acc} är ett balanskonto – beloppet tas med men syns bara i balansrapporter.`);
    d.forEach((c,i)=>{ if (c && OBJ[i] && Object.keys(OBJ[i]).length && OBJ[i][c]===undefined) errors.push(`Rad ${rn}: ${dimName(i)} ${c} finns inte.`); });
    const k = acc+"|"+d.join("|"); if (seen.has(k)) errors.push(`Rad ${rn}: dubblett av konto ${acc} med samma dimensioner.`); seen.add(k);
    months.forEach((c,i)=>{
      let v = row[c]; if (v===""||v==null) v = 0;
      if (typeof v==="string"){ v = v.replace(/\s| /g,"").replace(",","."); }
      const n = Number(v);
      if (!isFinite(n)) errors.push(`Rad ${rn}, ${MONTHS[i]}: ”${row[c]}” är inte ett tal.`);
      else if (n) rows.push([acc, i+1, n*dispSign(acc), ...d]);
    });
  }
  if (!rows.length && !errors.length) errors.push("Filen innehåller inga belopp.");
  return {rows, errors, warnings};
}
function showImport(){
  const res = $("#i_result"); const I = IMPORT;

    + (I.warnings.length ? `<div class="note">${I.warnings.slice(0,10).map(esc).join("<br>")}</div>` : "")
    + (byL.length ? `<table class="t" style="max-width:520px;margin:8px 0"><tr><th>Rad i resultaträkningen</th><th>Helår</th></tr>${byL.map(([n,v])=>`<tr><td>${esc(n)}</td><td>${nf0.format(v)}</td></tr>`).join("")}<tr class="total"><td>Resultat</td><td>${nf0.format(sum)}</td></tr></table>` : "")

}

async function saveUser(id){
  const err = m => { $("#u_err").textContent = m; };
  const name=$("#u_name").value.trim(), role=$("#u_role").value, pw=$("#u_pw").value;
  let cc = [...document.querySelectorAll("#u_cc .chip.on")].map(c=>c.dataset.chip); if (cc.includes("*")) cc=["*"];

  if (!cc.length) return err(`Välj minst en kod i ${dimName(PD())} eller Alla.`);
  const accs = ($("#u_acc").value||"").split(",").map(x=>x.trim()).filter(Boolean);

  const accounts = accs.map(x=>x.replace(/\s+/g,"")).join(", ");
  if (pw && (pw.length<8 || !/\d/.test(pw) || !/[a-zåäö]/i.test(pw))) return err("Lösenordet ska ha minst 8 tecken, med både bokstäver och siffror.");
  if (id){
    const u = S.users.find(x=>x.id===id);
    if (u.id===U.id && role!=="admin" && !S.users.some(x=>x.id!==U.id&&x.role==="admin"&&x.active)) return err("Det måste finnas minst en aktiv administratör.");
    const changes = [];
    if (u.role!==role) changes.push(`roll ${ROLES[u.role]} → ${ROLES[role]}`);
    if (u.cc.join()!==cc.join()) changes.push(`${dimName(PD()).toLowerCase()} ${u.cc.join(",")} → ${cc.join(",")}`);
    if ((u.accounts||"")!==accounts) changes.push(`konton ”${u.accounts||"alla"}” → ”${accounts||"alla"}”`);
    const act = $("#u_active") ? $("#u_active").classList.contains("on") : true;
    if (u.id===U.id && !act) return err("Du kan inte inaktivera dig själv.");

function loadDataset(ds){

  OBJ = Array.from({length:ND},()=>({})); (ds.objects||[]).forEach(([d,c,n])=>{ const i = dimIndex(d); if (i>=0 && i<ND) OBJ[i][String(c)] = n||""; });
  ACT = {}; AGG = {}; LASTP = {};
  const agg = new Map();
  for (const r of ds.rows){
    const y = r[0];
    (ACT[y]=ACT[y]||[]).push(r);
    if (!ACC[r[6]]) ACC[r[6]] = {name:"", type:""};
    for (let i=0;i<ND;i++){ const c = r[DI+i]; if (c && OBJ[i][c]===undefined) OBJ[i][c] = ""; }
    LASTP[y] = Math.max(LASTP[y]||0, r[1]);
    const k = y+"|"+r[1]+"|"+r[6]+"|"+r.slice(DI,DI+ND).join("|");
    agg.set(k, (agg.get(k)||0) + r[8]);
  }
  for (const [k,v] of agg){ const [y,p,acc,...d] = k.split("|"); (AGG[y]=AGG[y]||[]).push([+y,+p,"",0,0,"",acc,"",v,0,...d,"",""]); }
  YEARS = Object.keys(ACT).map(Number).sort(); OBC = {};

}
/* ---- läs Excel med verifikationsrader */
function parseBookkeeping(buf, fname){
  if (typeof XLSX==="undefined") throw new Error("Excelläsaren kunde inte laddas.");
  const wb = XLSX.read(new Uint8Array(buf), {type:"array", cellDates:true});
  const norm = s => String(s).trim().toLowerCase();
  const sheetRows = n => XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:"", raw:true});
  const hasCols = (n, cols) => { const r = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, range:0, defval:""})[0]||[]; const h = r.map(norm); return cols.every(c=>h.includes(c)); };
  const vs = wb.SheetNames.find(n=>norm(n)==="vourowx" && hasCols(n,["account","amount"])) || wb.SheetNames.find(n=>norm(n)==="vourow" && hasCols(n,["account","amount"])) || wb.SheetNames.find(n=>hasCols(n,["account","amount","period"]));
  if (!vs) throw new Error("Hittar ingen flik med kolumnerna account, amount och period (verifikationsrader).");
  // räkenskapsår: index -> kalenderår
  const fyMap = {};
  const fs = wb.SheetNames.find(n=>hasCols(n,["year","startdate"]));
  if (fs) sheetRows(fs).forEach(r=>{ const k = Object.fromEntries(Object.entries(r).map(([a,b])=>[norm(a),b])); const d = toDate(k.startdate); if (d) fyMap[String(k.year)] = d.getFullYear(); });
  const num = v => { if (typeof v==="number") return v; const s = String(v).replace(/\s| /g,"").replace(",","."); const n = parseFloat(s); return isFinite(n)?n:NaN; };
  const str = v => String(v==null?"":v).trim().replace(/\.0$/,"");
  const rows = []; let skipped = 0, altered2 = 0; const warn = [];
  sheetRows(vs).forEach(raw=>{
    const k = Object.fromEntries(Object.entries(raw).map(([a,b])=>[norm(a),b]));
    const acc = str(k.account), amt = num(k.amount), p = parseInt(k.period,10);
    if (num(k.altered)===2) { altered2++; return; }   // altered = 2 ska inte med
    if (!acc || !isFinite(amt) || !(p>=0 && p<=13)) { skipped++; return; }   // 0 = ingående balans, 13 = bokslut
    const d = toDate(k.date);
    let y = fyMap[str(k.year)];
    if (!y){ const yi = parseInt(k.year,10); y = yi>1900 ? yi : (d ? d.getFullYear() : null); }
    if (!y){ skipped++; return; }
    rows.push([y, Math.min(p,12), str(k.serie), parseInt(k.vouno,10)||0, parseInt(k.rowno,10)||0, d?isoDate(d):"", acc, str(k.currency)||"EUR", amt, isFinite(num(k.foramount))?num(k.foramount):amt, ...Array.from({length:ND},(_,i)=>str(k[dimCol(i)])), String(k.xfreetext||""), str(k.creator)]);
  });
  if (!rows.length) throw new Error("Filen innehåller inga läsbara verifikationsrader.");
  // kontoplan och objekt (valfria flikar)
  let accounts = [], objects = [];
  const as = wb.SheetNames.find(n=>n!==vs && hasCols(n,["account","name"]));
  if (as) accounts = sheetRows(as).map(r=>{ const k = Object.fromEntries(Object.entries(r).map(([a,b])=>[norm(a),b])); return [str(k.account), String(k.name||""), str(k.type)]; }).filter(a=>a[0]);
  const os = wb.SheetNames.find(n=>hasCols(n,["dim","code","name"]));
  if (os) objects = sheetRows(os).map(r=>{ const k = Object.fromEntries(Object.entries(r).map(([a,b])=>[norm(a),b])); return [str(k.dim), str(k.code), String(k.name||"")]; }).filter(o=>o[0]&&o[1]);
  if (!as) warn.push("Ingen flik med kontoplan (kolumnerna account och name) – kontona visas utan namn.");
  if (!os) warn.push("Ingen flik med objekt (kolumnerna dim, code och name) – dimensionernas koder visas utan namn.");
  if (altered2) warn.push(`${altered2} rader med altered = 2 exkluderades.`);
  if (skipped) warn.push(`${skipped} rader saknade konto, belopp, period eller år och hoppades över.`);
  // balanskontroll per verifikation
  const vb = new Map(); rows.forEach(r=>{ const kk = r[DI+8]+"|"+r[0]+"|"+r[2]+"|"+r[3]; vb.set(kk,(vb.get(kk)||0)+r[8]); });
  const unbal = [...vb.values()].filter(v=>Math.abs(v)>0.01).length;
  if (unbal) warn.push(`${unbal} verifikationer summerar inte till noll.`);
  const years = [...new Set(rows.map(r=>r[0]))].sort();
  return {ds:{rows, accounts, objects, name:fname}, info:{name:fname, rows:rows.length, years, accounts:new Set(rows.map(r=>r[6])).size, cc:new Set(rows.map(r=>r[DI+PD()]).filter(Boolean)).size, dims:Array.from({length:ND},(_,i)=>new Set(rows.map(r=>r[DI+i]).filter(Boolean)).size), vouchers:vb.size, warn, sheet:vs}};
}
function toDate(v){
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v==="number" && v>20000 && v<80000) return new Date(Math.round((v-25569)*864e5));
  const s = String(v||"").trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if ((m = s.match(/^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})/))) return new Date(+m[3], +m[2]-1, +m[1]);
  return null;
}

function renameLineRefs(oldId, newId){
  const st = S.structures[SEDIT]; const re = new RegExp("\\b"+oldId+"\\b","g");
  st.lines.forEach(l=>{ if (l.formula) l.formula = l.formula.replace(re,newId); });
  S.reports.forEach(r=>r.widgets.forEach(w=>{ if (w.structure!==SEDIT) return;
    if (w.line===oldId) w.line=newId; if (w.total===oldId) w.total=newId;
    if (w.lines) w.lines = w.lines.split(",").map(x=>x.trim()===oldId?newId:x).join(","); }));
}
function closeModal(){ WEDIT=null; DRILL=null; $("#modal").innerHTML=""; }

document.addEventListener("change", e => {
  const t = e.target;
  if (t.classList && t.classList.contains("vc")){
    const vid = (location.hash||"").slice(10); let v = editableVersion(vid); if (!v || v.locked) return;
    const val = parseIn(t.value); if (val===null){ toast("Ogiltigt tal"); t.focus(); return; }
    let n = 0;
    if (t.dataset.tot!==undefined){ n = distribute(v, t.dataset.tot, val); }
    else n = setCell(v, t.dataset.cell, +t.dataset.p, val) ? 1 : 0;
    if (n){ touchVersion(v); rerenderKeepFocus(); }
    return; }
  if (t.id==="ve_cc"){ VE.cc = t.value; VE.fd = +t.dataset.fd; render(); return; }
  if (t.dataset.gdim!==undefined){ const g = S.groups[+t.dataset.gdim]; g.dim = +t.value; g.codes = []; save(); render(); return; }
  if (t.dataset.f){ F[t.dataset.f] = t.dataset.f==="year"||t.dataset.f==="period" ? +t.value : t.value;
    if (t.dataset.f==="year"){ F.bud = (allVersions().find(v=>v.type==="budget"&&v.year==F.year)||{}).id||""; F.prg = defaultPrg(F.year); F.period = Math.min(F.period, LASTP[F.year]||12); }
    saveFilter(); render(); return; }
  if (t.dataset.dim!==undefined && t.dataset.code!==undefined){
    const i = t.dataset.dim, v = t.dataset.code; F.dim = F.dim||{}; const cur = F.dim[i]||[];
    F.dim[i] = v==="" ? [] : (t.checked ? [...cur, v] : cur.filter(x=>x!==v));
    if (!F.dim[i].length) delete F.dim[i];
    saveFilter(); render(); return; }
  if (t.dataset.unit!==undefined){ F.unit = t.dataset.unit; saveFilter(); render(); return; }
  if (t.id==="i_file" && t.files[0]) { handleImportFile(t.files[0]); return; }
  if (t.dataset.sl!==undefined){
    const l = S.structures[SEDIT].lines[+t.dataset.sl]; const k = t.dataset.k;
    if (k==="id"){ const nv=t.value.trim().replace(/[^A-Za-z0-9_]/g,""); if(!nv||S.structures[SEDIT].lines.some(x=>x!==l&&x.id===nv)){ toast("Id måste vara unikt"); render(); return; } renameLineRefs(l.id,nv); l.id=nv; }
    else l[k] = k==="sign" ? +t.value : t.value;
    save(); render(); return; }
  if (t.dataset.g!==undefined){ S.groups[+t.dataset.g].name = t.value; save(); return; }
  if (t.dataset.right){ S.rights[t.dataset.role][t.dataset.right] = t.checked; log("Rättighet ändrad", `${ROLES[t.dataset.role]}: ${RIGHTS[t.dataset.right]} = ${t.checked?"ja":"nej"}`); save(); render(); return; }
  if (t.dataset.a==="selStruct"){ SEDIT = t.value; render(); return; }
  if (WEDIT && (t.id==="e_structure" || t.id==="e_mode" || t.id==="e_rowsMode" || t.id==="e_colMode" || t.id==="e_dim")){ const w = readWidgetForm(); fixWidget(w); const tmp = WEDIT; tmp.rep.widgets[tmp.i] = w; editWidget(tmp.rep, tmp.i); return; }
});
let veT=null;
document.addEventListener("input", e => { if (e.target.id==="ve_q"){ VE.q = e.target.value; clearTimeout(veT); veT=setTimeout(()=>rerenderKeepFocus(),250); return; } });
document.addEventListener("keydown", e => {
  const t = e.target; if (!(t.classList && t.classList.contains("vc")) || e.key!=="Enter") return;
  e.preventDefault(); const col = t.dataset.p ? `[data-p="${t.dataset.p}"]` : "[data-tot]";
  const list = [...document.querySelectorAll(".tbl-desk .vc"+col)].filter(x=>x.offsetParent); const i = list.indexOf(t);
  t.blur(); setTimeout(()=>{ const nx = [...document.querySelectorAll(".tbl-desk .vc"+col)].filter(x=>x.offsetParent)[i+1]; if (nx){ nx.focus(); nx.select(); } }, 30);
});
function rerenderKeepFocus(){
  const a = document.activeElement; const sel = a && a.id ? "#"+a.id : (a && a.dataset && a.dataset.cell ? `.tbl-desk [data-cell="${CSS.escape(a.dataset.cell)}"][data-p="${a.dataset.p}"]` : (a && a.dataset && a.dataset.tot!==undefined ? `.tbl-desk [data-tot="${CSS.escape(a.dataset.tot)}"]` : null));
  const pos = a && a.selectionStart; const y = scrollY; const tw = document.querySelector(".vgrid") && document.querySelector(".vgrid").closest(".tw"); const st = tw ? [tw.scrollTop, tw.scrollLeft] : null;
  render(); scrollTo(0,y);
  const tw2 = document.querySelector(".vgrid") && document.querySelector(".vgrid").closest(".tw"); if (tw2 && st){ tw2.scrollTop = st[0]; tw2.scrollLeft = st[1]; }
  if (sel){ const el = document.querySelector(sel); if (el){ el.focus(); try{ if (el.id) el.setSelectionRange(pos,pos); else el.select(); }catch(_){} } }
}
document.addEventListener("input", e => { if (e.target.id==="vsearch"){ const q=e.target.value.toLowerCase();
  document.querySelectorAll("#vtab tr").forEach((tr,i)=>{ if(i) tr.style.display = tr.textContent.toLowerCase().includes(q)?"":"none"; });
  document.querySelectorAll("#vlist .vr").forEach(d=>{ d.style.display = d.textContent.toLowerCase().includes(q)?"":"none"; }); } });

document.addEventListener("click", async e => {
  const T = e.target;
  const demo = T.closest("[data-demo]"); if (demo){ const [u,p]=demo.dataset.demo.split("|"); $("#lu").value=u; $("#lp").value=p; $("#lp").focus(); return; }
  const go = T.closest("[data-go]"); if (go){ location.hash = go.dataset.go; return; }
  const chip = T.closest(".chip");
  if (chip && chip.closest(".modal")){
    if (chip.dataset.col){ const box = chip.parentElement; chip.classList.toggle("on"); const ons=[...box.querySelectorAll(".chip.on")].filter(c=>c!==chip);
      if (ons.length) ons[ons.length-1].after(chip); else box.prepend(chip); return; }
    if (chip.dataset.single){ chip.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c===chip)); return; }
    if (chip.parentElement.id==="u_cc"){ if (chip.dataset.chip==="*"){ const was = chip.classList.contains("on"); chip.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); if(!was) chip.classList.add("on"); } else { chip.parentElement.querySelector('[data-chip="*"]').classList.remove("on"); chip.classList.toggle("on"); } return; }
    chip.classList.toggle("on"); return;
  }
  if (chip && chip.dataset.gc!==undefined){ const g=S.groups[+chip.dataset.gc]; const c=chip.dataset.c; g.codes = g.codes.includes(c)?g.codes.filter(x=>x!==c):[...g.codes,c]; save(); render(); return; }
  const sec = T.closest("[data-sec]"); if (sec){ const k = sec.dataset.sec; COLLAPSED.has(k)?COLLAPSED.delete(k):COLLAPSED.add(k); render(); return; }
  const dr = T.closest("[data-drill]");
  if (dr){ const tbl = dr.closest("table"); const w = findWidget(tbl.dataset.w); if (w){ openDrill(w, tableModel(w).rows[+dr.dataset.drill]); } return; }
  const md = T.closest("[data-mdrill]");
  if (md){ const w = findWidget(md.dataset.w); if (w) openDrill(w, tableModel(w).rows[+md.dataset.mdrill]); return; }
  const vmr = T.closest("[data-vmr]"); if (vmr && T.closest(".mtop, .msub")){ const k=vmr.dataset.vmr; VE.open.has(k)?VE.open.delete(k):VE.open.add(k); render(); return; }
  const mr = T.closest("[data-mr]"); if (mr && T.closest(".mtop, .msub")){ mr.classList.toggle("open"); return; }
  const ins = T.closest("[data-ins]");
  if (ins){ openDrill({structure:ins.dataset.st,title:"Avvikelser"}, {line:ins.dataset.ins,label:""}); return; }
  const da = T.closest("[data-dacc]");
  if (da && DRILL){ const st=S.structures[DRILL.w.structure]; const ln = st.lines.find(l=>l.id===da.dataset.dl); const a = da.dataset.dacc;
    DRILL = {w:DRILL.w, acc:a, sign:ln?ln.sign:-1, scope:ln&&ln.scope, cc:DRILL.cc, title:`${a} ${ACC[a]?ACC[a].name:""}`, back:DRILL}; drawDrill(); return; }
  const fs = T.closest("[data-fsec]"); if (fs){ const k=fs.dataset.fsec; OPENSEC.has(k)?OPENSEC.delete(k):OPENSEC.add(k); fs.parentElement.classList.toggle("open"); return; }
  const inMenu = T.closest("#menu .menu");
  const el = T.closest("[data-a]");
  if (!inMenu && !(el && /menu$/.test(el.dataset.a||""))) closeMenu();
  if (!el) return;
  if (inMenu) closeMenu();
  const a = el.dataset.a; const rep = currentReport(); const i = +el.dataset.i;
  switch(a){
    case "logout": e.preventDefault(); logout(); break;
    case "fopen": if (innerWidth<=820){ FOPEN=true; render(); } else { $("#modal").innerHTML = `<div class="modal-bg" data-a="wClose"><div class="modal" style="width:min(420px,100%)"><div class="mh"><h2>Filter</h2><button class="ibtn" data-a="wClose">${ic("x")}</button></div>${filterSections()}</div></div>`; } break;
    case "fclose": FOPEN=false; render(); break;
    case "fpToggle": FPCOLL=!FPCOLL; render(); break;
    case "dsGo": location.hash = "#data"; break;
    case "dsPick": pickDataFile(); break;
    case "dsReload": reloadData(); break;
    case "dsTest": useTestData(); break;
    case "dsKeep": S.settings.keepData = el.checked; save(); if (!el.checked) IDB.del("dataset"); else if (CURDS) IDB.set("dataset", CURDS); toast(el.checked?"Datan sparas mellan sessioner":"Datan sparas inte längre"); break;
    case "theme": { const dark = document.documentElement.classList.contains("dark"); setTheme(dark?"light":"dark"); break; }
    case "setTheme": setTheme(el.dataset.t); break;
    case "umenu": openMenu(el, userMenuHtml()); break;
    case "navmenu": openMenu(el, navMenuHtml()); break;
    case "adminmenu": openMenu(el, adminNav().map(x=>`<a href="#${x.h}">${ic(x.i,17)}<span>${esc(x.l)}</span></a>`).join("")); break;
    case "repmenu": openMenu(el, repMenuHtml(rep)); break;
    case "wmenu": openMenu(el, widgetMenuHtml(rep, i)); break;
    case "wFull": fullscreenWidget(rep, i); break;
    case "wTable": { const id = rep.widgets[i].id; TABLEVIEW.has(id)?TABLEVIEW.delete(id):TABLEVIEW.add(id); render(); break; }
    case "wDupl": { const c = clone(rep.widgets[i]); c.id=uid("w"); rep.widgets.splice(i+1,0,c); save(); render(); break; }
    case "setHome": U.home = rep.id; save(); toast("Startsidan är ändrad"); render(); break;
    case "newView": newViewDialog(); break;
    case "nvSave": createView(); break;
    case "kAdd": { const w = readWidgetForm(); w.items = [...(w.items||[]), {title:"Nytt nyckeltal",line:(S.structures[w.structure].lines.find(l=>l.type!=="header")||{}).id,icon:"bars",color:"#3563c9"}]; WEDIT.rep.widgets[WEDIT.i]=w; editWidget(WEDIT.rep, WEDIT.i); break; }
    case "kDel": { const w = readWidgetForm(); w.items.splice(+el.dataset.k,1); WEDIT.rep.widgets[WEDIT.i]=w; editWidget(WEDIT.rep, WEDIT.i); break; }
    case "kUp": { const w = readWidgetForm(); const k=+el.dataset.k; if (k>0){ [w.items[k-1],w.items[k]]=[w.items[k],w.items[k-1]]; } WEDIT.rep.widgets[WEDIT.i]=w; editWidget(WEDIT.rep, WEDIT.i); break; }
    case "print": try{ window.print(); }catch(err){} setTimeout(()=>toast("Fungerar inte utskrift här – öppna filen lokalt i webbläsaren"),400); break;
    case "editRep": EDIT = rep.id; render(); break;
    case "editDone": EDIT = null; log("Vy sparad", rep.name); render(); break;
    case "dupReport": { const r = clone(rep); r.id=uid("r"); r.name = rep.name+" (kopia)"; r.owner=U.id; r.group=null; r.roles=[]; r.widgets.forEach(w=>w.id=uid("w")); S.reports.push(r); save(); EDIT=r.id; log("Vy kopierad", r.name); location.hash="#rapport-"+r.id; break; }
    case "addW": if (!el.dataset.t){ pickWidgetType(); break; } rep.widgets.push(newWidget(el.dataset.t)); save(); closeModal(); render(); editWidget(rep, rep.widgets.length-1); break;
    case "wUp": if (i>0){ [rep.widgets[i-1],rep.widgets[i]]=[rep.widgets[i],rep.widgets[i-1]]; save(); render(); } break;
    case "wDown": if (i<rep.widgets.length-1){ [rep.widgets[i+1],rep.widgets[i]]=[rep.widgets[i],rep.widgets[i+1]]; save(); render(); } break;
    case "wDel": rep.widgets.splice(i,1); save(); render(); toast("Delen togs bort"); break;
    case "wEdit": WEDIT = {rep, i, orig: clone(rep.widgets[i])}; editWidget(rep, i); break;
    case "wSave": { const w = readWidgetForm(); fixWidget(w); WEDIT.rep.widgets[WEDIT.i] = w; save(); closeModal(); render(); break; }
    case "wClose": if (T!==el && el.classList.contains("modal-bg")) break; if (WEDIT && WEDIT.orig) WEDIT.rep.widgets[WEDIT.i] = WEDIT.orig; closeModal(); render(); break;
    case "repProps": reportProps(rep); break;
    case "repPropsSave": rep.name = $("#rp_name").value.trim()||rep.name; rep.desc=$("#rp_desc").value.trim(); rep.icon = ($("#rp_icon .chip.on")||{dataset:{chip:"chart"}}).dataset.chip; if (!rep.owner){ rep.group = $("#rp_group").value.trim()||rep.group; rep.roles=[...document.querySelectorAll("#rp_roles .chip.on")].map(c=>c.dataset.chip); } save(); closeModal(); render(); break;
    case "repDelete": if (el.dataset.sure){ S.reports = S.reports.filter(r=>r!==rep); log("Rapport borttagen", rep.name); save(); EDIT=null; closeModal(); location.hash="#start"; } else { el.dataset.sure=1; el.textContent="Klicka igen för att ta bort"; } break;
    case "copyT": copyText(aoaToTsv(tableToAoa(rep.widgets[i]))); break;
    case "xlsT": downloadXlsx(tableToAoa(rep.widgets[i]), (rep.widgets[i].title||"tabell").replace(/[^\wåäöÅÄÖ -]/g,"")+".xlsx"); break;
    case "drillClose": if (T===el || el.tagName!=="DIV"){ closeModal(); } break;
    case "drillBack": if (DRILL && DRILL.back){ DRILL = DRILL.back; drawDrill(); } break;
    case "tplXls": downloadXlsx(templateRows(false), "prognosmall.xlsx", "Prognos"); break;
    case "tplCopy": copyText(aoaToTsv(templateRows(false))); break;
    case "tplFromBud": downloadXlsx(templateRows(true), "prognosmall_"+(version(F.bud)||{name:"budget"}).name.replace(/\s/g,"_")+".xlsx", "Prognos"); break;
    case "doImport": doImport(); break;
    case "vNew": newVersionDialog(null); break;
    case "vCopy": newVersionDialog(el.dataset.v); break;
    case "nvvSave": createVersion(); break;
    case "vrAdd": addRowDialog(version((location.hash||"").slice(10))); break;
    case "nrSave": { const v = editableVersion(el.dataset.v); const acc=$("#nr_acc").value; const d = Array.from({length:ND},(_,i)=>{ const e=$("#nr_d"+i); return e?e.value:""; }); const k = acc+"|"+d.join("|");
      if (versionGrid(v).some(r=>r.k===k)){ toast("Raden finns redan"); break; }
      const tot = parseIn($("#nr_tot").value)||0; for (let p=1;p<=12;p++) v.rows.push([acc,p,0,...d]); distribute(v,k,tot);
      const lbl = keyLabel(d, Array.from({length:ND},(_,i)=>i));
      (v.changes=v.changes||[]).unshift({t:new Date().toISOString(),user:U.username,text:`Ny rad ${acc}${lbl?" / "+lbl:""}, helår ${nf0.format(tot)}`});
      touchVersion(v); closeModal(); render(); break; }
    case "vrDel": { if (!el.dataset.sure){ el.dataset.sure=1; el.innerHTML = "Ta bort?"; el.classList.add("btn","sm","danger"); break; }
      const v = editableVersion((location.hash||"").slice(10)); const [acc,...d] = el.dataset.k.split("|");
      v.rows = v.rows.filter(r=>!sameKey(r,acc,d)); const lbl = keyLabel(d, Array.from({length:ND},(_,i)=>i)); (v.changes=v.changes||[]).unshift({t:new Date().toISOString(),user:U.username,text:`Raden ${acc}${lbl?" / "+lbl:""} togs bort`}); touchVersion(v); render(); break; }
    case "vPct": { const v = editableVersion(el.dataset.v); const pct = parseIn($("#ve_pct").value); const from = +$("#ve_from").value;
      if (!pct){ toast("Ange en procentsats, t.ex. 5 eller -3"); break; }
      let n = 0;
      veFilter(versionGrid(v))
        .forEach(r=>{ for (let p=from;p<=12;p++){ if (r.vals[p-1] && setCell(v,r.k,p,Math.round(r.vals[p-1]*(1+pct/100)))) n++; } });
      if (n){ v.changes.splice(0,n); v.changes.unshift({t:new Date().toISOString(),user:U.username,text:`Justerade ${n} belopp med ${pct>0?"+":""}${String(pct).replace(".",",")} % från ${MONTHS_LONG[from-1]}${VE.cc?" ("+dimName(VE.fd!=null?VE.fd:PD())+" "+VE.cc+")":""}${VE.q?" (sök: "+VE.q+")":""}`}); touchVersion(v); toast(`${n} belopp justerade`); render(); } else toast("Inga belopp att justera i urvalet");
      break; }
    case "vXls": { const v = version(el.dataset.v); const g = versionGrid(v); const dims = verDimsUsed(v.rows); downloadXlsx([["Konto","Kontonamn",...dims.map(dimName),...Array.from({length:12},(_,i)=>String(i+1))], ...g.map(r=>[r.acc, ACC[r.acc]?ACC[r.acc].name:"", ...dims.map(i=>r.d[i]), ...r.vals.map(x=>Math.round(x))])], v.name.replace(/[^\wåäöÅÄÖ -]/g,"")+".xlsx", "Version"); break; }

    case "vLock": { const v = editableVersion(el.dataset.v); v.locked=!v.locked; if (DATA.versions.includes(v)) toast("Inbyggd version – ändringen gäller tills sidan laddas om"); log(v.locked?"Version låst":"Version upplåst", v.name); save(); render(); break; }
    case "vDel": { const v = version(el.dataset.v); if (v.locked) return; if (el.dataset.sure){ if (DATA.versions.includes(v)) S.deletedBuiltin.push(v.id); else S.versions=S.versions.filter(x=>x!==v); log("Version borttagen", v.name); if (F.bud===v.id) F.bud=""; if (F.prg===v.id) F.prg=defaultPrg(F.year); saveFilter(); save(); render(); } else { el.dataset.sure=1; el.textContent="Bekräfta"; } break; }
    case "slUp": { const L=S.structures[SEDIT].lines; if(i>0){[L[i-1],L[i]]=[L[i],L[i-1]]; save(); render();} break; }
    case "slDown": { const L=S.structures[SEDIT].lines; if(i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]]; save(); render();} break; }
    case "slAdd": { const L=S.structures[SEDIT].lines; let n=L.length+1; while(L.some(l=>l.id==="N"+n)) n++; L.splice(i+1,0,{id:"N"+n,name:"Ny rad",type:"accounts",accounts:"",formula:"",sign:-1,style:"",format:""}); save(); render(); break; }
    case "slDel": { if (el.dataset.sure){ S.structures[SEDIT].lines.splice(i,1); save(); render(); } else { el.dataset.sure=1; el.textContent="Säker?"; } break; }
    case "resetStruct": if (el.dataset.sure){ const d=defaultStructures(); if (d[SEDIT]) S.structures[SEDIT]=d[SEDIT]; log("Struktur återställd", SEDIT); save(); render(); } else { el.dataset.sure=1; el.textContent="Klicka igen för att återställa"; } break;
    case "newStruct": { const k=uid("s"); S.structures[k]={name:"Ny struktur",kind:"flow",lines:[{id:"A1",name:"Ny rad",type:"accounts",accounts:"3000-3999",formula:"",sign:-1,style:"",format:""}]}; SEDIT=k; save(); render(); break; }
    case "gAdd": S.groups.push({id:uid("g"),name:"Ny sammanslagning",dim:PD(),codes:[]}); save(); render(); break;
    case "dimSave": { const old = PD(); S.dims = Array.from({length:ND},(_,i)=>({name:$("#s_dn"+i).value.trim()||dimCol(i), active:$("#s_da"+i).checked})); S.settings.permDim = +$("#s_pd").value;
      log("Dimensioner ändrade", S.dims.map((d,i)=>`${dimCol(i)}=${d.name}${d.active?"":" (av)"}`).join(", ")+(old!==PD()?`; behörighet via ${dimName(PD())}`:"")); save(); toast(old!==PD()?"Sparat – se över användarnas behörigheter":"Sparat"); render(); break; }
    case "gDel": if (el.dataset.sure){ S.groups.splice(i,1); save(); render(); } else { el.dataset.sure=1; el.textContent="Säker?"; } break;
    case "uAdd": editUser(""); break;
    case "uEdit": editUser(el.dataset.u); break;
    case "uSave": await saveUser(el.dataset.u); break;
    case "uDel": if (el.dataset.sure){ const u=S.users.find(x=>x.id===el.dataset.u); S.users=S.users.filter(x=>x!==u); log("Användare borttagen", u.username); save(); closeModal(); render(); } else { el.dataset.sure=1; el.textContent="Klicka igen för att ta bort"; } break;
    case "setSave": { const s=S.settings; s.orgName=$("#s_org").value; s.brand=$("#s_brand").value; s.unit=$("#s_unit").value; s.timeoutMin=Math.max(5,+$("#s_to").value||30); s.hiddenAccounts=$("#s_hidden").value; applyBrand(); log("Inställningar ändrade"); save(); toast("Sparat"); render(); break; }
    case "cfgCopy": { const c = clone(S); c.users = c.users.map(u=>({...u,pw:"***",salt:"***"})); copyText(JSON.stringify(c,null,2)); break; }
    case "cfgReset": if (el.dataset.sure){ LS.del(KEY); LS.del(KEY+"_filter"); S = await defaultState(); save(); U = S.users.find(u=>u.username==="admin"); touch(); initFilter(); applyBrand(); location.hash="#start"; render(); toast("Allt är återställt"); } else { el.dataset.sure=1; el.textContent="Klicka igen – allt raderas"; } break;
  }
});
document.addEventListener("keydown", e => { if (e.key==="Escape"){ closeMenu(); if ($("#modal").innerHTML){ if (WEDIT && WEDIT.orig) WEDIT.rep.widgets[WEDIT.i]=WEDIT.orig; closeModal(); render(); } else if (FOPEN){ FOPEN=false; render(); } } });
boot();
